name: Webhelp
description: Webhelp is a French customer-experience and business-process-outsourcing (BPO) company
  founded in 2000 and headquartered in Paris, providing outsourced customer support, sales, back-office,
  content moderation, and payment/collections services to global brands across many languages and geographies.
  In 2023 Webhelp merged with Concentrix; the combined company operates under the Concentrix brand and the
  standalone webhelp.com domain no longer resolves to a live website. Webhelp was surfaced in the API
  Evangelist network as a portfolio company of Insight Partners. It is a services/BPO operator rather than
  an API producer and publishes no public developer portal, OpenAPI definition, or client SDKs; the
  enrichment pipeline found no public API surface to catalog.
